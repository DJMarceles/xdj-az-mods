[Service]
# Cached first start: EP147 preloads the set az-usbload last applied, from
# p7, with no USB access before it starts. Absent or empty (fresh flash, or the chosen
# stick asked for none) -> stock. az-usbload rewrites this only when the stick's set
# differs; the change loads at the next EP147 start (az-usbload's RESTART POLICY says
# when the loader restarts EP147 itself).
EnvironmentFile=-/home/root/settings/az-usbload/az-preload.env
# After every EP147 start: re-announce the USB if this was a restart the loader did
# not make itself (mod-menu RELOAD, crash restart), since EP147 drops mounted media on
# a restart. Backgrounded so the start job (and the boot transaction) never waits on it;
# az-usbload --post-start exits at once on the boot's first start.
ExecStartPost=-/bin/sh -c '/usr/sbin/az-usbload --post-start </dev/null >/dev/null 2>&1 &'
